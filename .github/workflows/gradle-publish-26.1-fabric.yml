name: Build Fabric Broadcast Edition (26.1.2, 26.2, 26.3)
on:
  workflow_dispatch:
  push:
    branches: ["26.1-fabric"]
permissions:
  contents: write
concurrency:
  group: netmusic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    env:
      MC_VERSION: ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Generate official station directory
        run: python3 scripts/generate_radio_catalog.py
      - name: Check revised UI and language coverage
        run: python3 scripts/verify_revision.py
      - name: Build and test
        run: ./gradlew build -Pminecraft_version="$MC_VERSION" --no-daemon --stacktrace
      - name: Dedicated server initialization smoke test
        run: ./gradlew runServer -Pminecraft_version="$MC_VERSION" --args='--initSettings --nogui' --no-daemon --stacktrace
      - name: Verify packaged radio audio decoding
        run: python3 scripts/verify_radio_audio.py "$MC_VERSION"
      - name: Inspect playable artifact
        run: |
          python3 scripts/verify_artifact.py "$MC_VERSION"
          cp build/radio-directory-report.json "build/$MC_VERSION/libs/"
          cp "build/$MC_VERSION/radio-audio-report.json" "build/$MC_VERSION/libs/"
          cp README.md "build/$MC_VERSION/libs/README.txt"
          cd "build/$MC_VERSION/libs"
          sha256sum *-all.jar *-sources.jar radio-directory-report.json radio-audio-report.json README.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: netmusic-${{ matrix.minecraft }}-fabric
          path: |
            build/${{ matrix.minecraft }}/libs/*-all.jar
            build/${{ matrix.minecraft }}/libs/*-sources.jar
            build/${{ matrix.minecraft }}/libs/SHA256SUMS.txt
            build/${{ matrix.minecraft }}/libs/radio-directory-report.json
            build/${{ matrix.minecraft }}/libs/radio-audio-report.json
            build/${{ matrix.minecraft }}/libs/README.txt
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="broadcast-$MC_VERSION-${{ github.run_number }}"
          gh release create "$TAG" --target "${{ github.sha }}" --draft --title "NetMusic $MC_VERSION Fabric — Broadcast Edition" --notes-file README.md "build/$MC_VERSION/libs/"*-all.jar "build/$MC_VERSION/libs/"*-sources.jar "build/$MC_VERSION/libs/SHA256SUMS.txt" "build/$MC_VERSION/libs/radio-directory-report.json" "build/$MC_VERSION/libs/radio-audio-report.json" "build/$MC_VERSION/libs/README.txt"
          echo "Release remains draft until its uploaded asset sizes and digests are verified."
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ matrix.minecraft }}
          path: |
            build/${{ matrix.minecraft }}/reports/tests/
            build/${{ matrix.minecraft }}/test-results/
            build/radio-directory-report.json
            build/${{ matrix.minecraft }}/radio-audio-report.json
